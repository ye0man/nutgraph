# Last-resort manual mint seeds.
#
# Only for mints that survive every automated source AND are known-good. Keep
# this small -- an entry here is a data-quality flag that discovery is
# incomplete. The testnut mints below are unbacked and always available, which
# keeps the mint pipeline demonstrable even when relays/directories are blocked.

mints:
  - url: https://testnut.cashu.space
    note: testnut mint (fake ecash, with fees)
  - url: https://nofee.testnut.cashu.space
    note: testnut mint (fake ecash, no fees)
