# Core modules: first-class implementations of the Cashu spec.
#
# These sit in the inner orbit around the NUT hub. Curation rule: this file is
# small, stable, and only changes when our *understanding* of the ecosystem
# changes -- not when the world changes. Edges between them are machine-derived.
#
# Only protocol implementations belong here. Anything that builds on another
# core (e.g. coco on cashu-ts, or a language binding) is NOT core: it orbits
# what it depends on, attached by the machine-derived dependency graph.
#
# `id` is the canonical owner/repo slug used as the node id everywhere.

core:
  - id: cashubtc/cashu-ts
    name: cashu-ts
    language: typescript
    description: TypeScript library for building Cashu wallets.
    url: https://github.com/cashubtc/cashu-ts

  - id: cashubtc/cdk
    name: Cashu Development Kit (cdk)
    language: rust
    description: Rust library implementing the Cashu protocol.
    url: https://github.com/cashubtc/cdk

  - id: cashubtc/nutshell
    name: Nutshell
    language: python
    description: Python library, CLI wallet, and reference mint implementation of the Cashu protocol.
    url: https://github.com/cashubtc/nutshell
